<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Laminados RD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(circle at top,#123f78 0%,#06101f 38%,#020712 100%);
  padding:28px 14px;
  color:#fff;
}

@keyframes copyShake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  50%{transform:translateX(7px)}
  75%{transform:translateX(-4px)}
  100%{transform:translateX(0)}
}

.card{
  max-width:430px;
  margin:auto;
  padding:22px;
  border-radius:26px;
  background:rgba(2,10,25,.82);
  border:1px solid rgba(70,140,255,.35);
  box-shadow:0 0 45px rgba(0,0,0,.75);
}

.logo{display:flex;justify-content:center;margin-bottom:16px;}

.logo-circle{
  width:120px;
  height:120px;
  border-radius:50%;
  background:#fff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo-circle img{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.18);
}

.subtitle{
  text-align:center;
  margin:8px 0 20px;
  font-size:26px;
  font-weight:900;
}

.info{
  border:1px solid rgba(90,150,255,.45);
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
  background:rgba(4,18,40,.72);
}

.info-row{margin-bottom:14px;}
.info-row:last-child{margin-bottom:0;}

.label{
  color:#1684ff;
  font-weight:800;
  font-size:14px;
  text-transform:uppercase;
}

.value{
  margin-top:4px;
  color:#fff;
  font-size:15px;
  font-weight:700;
}

.bank{
  border:1px solid rgba(120,170,255,.45);
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:14px;
  background:rgba(5,16,35,.86);
}

.bank.copiado{animation:copyShake .28s ease;}
.bank.santacruz.copiado{box-shadow:0 0 26px rgba(0,110,255,.95);}
.bank.banesco.copiado{box-shadow:0 0 26px rgba(0,190,90,.95);}

.bank-logo{
  width:92px;
  min-width:92px;
  text-align:center;
}

.bank-logo img{
  width:78px;
  height:78px;
  object-fit:contain;
}

.bank-logo strong{
  display:block;
  margin-top:4px;
  font-size:14px;
}

.bank-content{
  flex:1;
  text-align:center;
}

.account-type{
  display:inline-block;
  padding:6px 12px;
  border-radius:9px;
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}

.santacruz .account-type{background:#075fd1;}
.banesco .account-type{background:#008c48;}

.account-label{
  font-size:12px;
  color:#b9c4d4;
  font-weight:800;
  letter-spacing:.4px;
}

.account-number{
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
  margin:5px 0 10px;
}

.copy-btn{
  width:100%;
  border:none;
  border-radius:12px;
  padding:11px;
  color:#fff;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}

.santacruz .copy-btn{background:#075fd1;}
.banesco .copy-btn{background:#008c48;}

.copy-btn:active{transform:scale(.96);}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#101827;
  color:#fff;
  padding:12px 18px;
  border-radius:16px;
  font-size:14px;
  box-shadow:0 0 20px rgba(0,0,0,.8);
  opacity:0;
  transition:opacity .3s ease;
  z-index:9999;
}

.toast.show{opacity:1;}

.footer-text{
  margin-top:20px;
  text-align:center;
  font-size:13px;
  color:#d7dce5;
  opacity:.9;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    <div class="logo-circle">
      <img src="logo.png" alt="Logo Laminados RD">
    </div>
  </div>

  <div class="subtitle">LAMINADOS RD</div>

  <div class="info">
    <div class="info-row">
      <div class="label">Empresa:</div>
      <div class="value">GRUPO BYDEMES LAMINADOS Y SERV RD SRL</div>
    </div>

    <div class="info-row">
      <div class="label">RNC:</div>
      <div class="value">133-16232-6</div>
    </div>
  </div>

  <div class="bank santacruz">
    <div class="bank-logo">
      <img src="santacruz.png" alt="Banco Santa Cruz">
      <strong>Santa Cruz</strong>
    </div>

    <div class="bank-content">
      <div class="account-type">CUENTA CORRIENTE</div>
      <div class="account-label">NÚMERO DE CUENTA</div>
      <div class="account-number">11432010015511</div>
      <button class="copy-btn" onclick="copiar('11432010015511','santacruz')">
        COPIAR NÚMERO DE CUENTA
      </button>
    </div>
  </div>

  <div class="bank banesco">
    <div class="bank-logo">
      <img src="banesco.png" alt="Banesco">
      <strong>Banesco</strong>
    </div>

    <div class="bank-content">
      <div class="account-type">CUENTA DE AHORROS</div>
      <div class="account-label">AHORRO COMERCIAL</div>
      <div class="account-number">6200054988</div>
      <button class="copy-btn" onclick="copiar('6200054988','banesco')">
        COPIAR NÚMERO DE CUENTA
      </button>
    </div>
  </div>

  <div class="footer-text">
    Gracias por su preferencia.
  </div>

</div>

<script>
function copiar(texto,banco){
  navigator.clipboard.writeText(texto);

  let el = document.querySelector("." + banco);

  if(el){
    el.classList.remove("copiado");
    void el.offsetWidth;
    el.classList.add("copiado");
    setTimeout(()=>el.classList.remove("copiado"),300);
  }

  mostrarToast("Cuenta copiada: " + texto);
}

function mostrarToast(texto){
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.innerText = texto;
  document.body.appendChild(toast);

  setTimeout(()=>toast.classList.add("show"),10);

  setTimeout(()=>{
    toast.classList.remove("show");
    setTimeout(()=>toast.remove(),300);
  },2200);
}
</script>

</body>
</html>
