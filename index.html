<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laminados RD</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
background:linear-gradient(180deg,#0a1325,#000);
padding:25px 15px;
color:white;
}

.card{
max-width:420px;
margin:auto;
background:#08111f;
padding:25px;
border-radius:25px;
border:1px solid rgba(255,255,255,.1);
box-shadow:0 0 35px rgba(0,0,0,.7);
}

.logo{
display:flex;
justify-content:center;
margin-bottom:12px;
}

.logo img{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
background:white;
}

h1{
text-align:center;
margin-bottom:8px;
font-size:28px;
}

.rnc{
text-align:center;
font-size:15px;
color:#d6d6d6;
margin-bottom:22px;
cursor:pointer;
}

.rnc span{
font-weight:800;
color:#fff;
}

.bank{
background:#101927;
padding:16px;
border-radius:20px;
margin-bottom:15px;
border:1px solid rgba(255,255,255,.08);
transition:.3s;
}

.bank.copiado,
.rnc.copiado{
transform:scale(1.03);
}

.bank-top{
display:flex;
align-items:center;
gap:14px;
margin-bottom:14px;
}

.bank-logo{
width:62px;
height:62px;
border-radius:50%;
overflow:hidden;
background:white;
padding:8px;
flex-shrink:0;
}

.bank-logo img{
width:100%;
height:100%;
object-fit:contain;
}

.bank-info{
flex:1;
}

.type{
font-size:13px;
color:#4fa8ff;
font-weight:bold;
margin-bottom:5px;
}

.number{
font-size:22px;
font-weight:900;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:15px;
font-size:15px;
font-weight:800;
color:white;
cursor:pointer;
}

.santa-btn{
background:#008a45;
}

.banesco-btn{
background:#0068ff;
}

.toast{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
background:#111;
padding:14px 18px;
border-radius:20px;
opacity:0;
transition:.3s;
z-index:999;
}

.toast.show{
opacity:1;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
<img src="logo.png">
</div>

<h1>LAMINADOS RD</h1>

<div class="rnc" onclick="copiarRNC()">
RNC: <span>133-16232-6</span>
</div>

<div class="bank santa-card">

<div class="bank-top">
<div class="bank-logo">
<img src="santacruz.png">
</div>

<div class="bank-info">
<div class="type">CUENTA CORRIENTE SANTA CRUZ</div>
<div class="number">11432010015511</div>
</div>
</div>

<button class="btn santa-btn" onclick="copiar('11432010015511','santa-card')">
Copiar cuenta
</button>

</div>

<div class="bank banesco-card">

<div class="bank-top">
<div class="bank-logo">
<img src="banesco.png">
</div>

<div class="bank-info">
<div class="type">CUENTA AHORRO COMERCIAL BANESCO</div>
<div class="number">6200054988</div>
</div>
</div>

<button class="btn banesco-btn" onclick="copiar('6200054988','banesco-card')">
Copiar cuenta
</button>

</div>

</div>

<script>
function copiar(numero,clase){
navigator.clipboard.writeText(numero);

let card=document.querySelector("." + clase);
card.classList.add("copiado");

setTimeout(()=>{
card.classList.remove("copiado");
},300);

mostrarToast("Cuenta copiada ✓");
}

function copiarRNC(){
navigator.clipboard.writeText("133-16232-6");

let rnc=document.querySelector(".rnc");
rnc.classList.add("copiado");

setTimeout(()=>{
rnc.classList.remove("copiado");
},300);

mostrarToast("RNC copiado ✓");
}

function mostrarToast(texto){
const toast=document.createElement("div");
toast.className="toast";
toast.innerText=texto;
document.body.appendChild(toast);

setTimeout(()=>{
toast.classList.add("show");
},50);

setTimeout(()=>{
toast.classList.remove("show");
setTimeout(()=>{
toast.remove();
},300);
},2000);
}
</script>

</body>
</html>
