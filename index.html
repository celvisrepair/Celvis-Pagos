<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laminados RD</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
background:linear-gradient(180deg,#0a1325,#000);
padding:25px 15px;
color:white;
}

.card{
max-width:420px;
margin:auto;
background:#08111f;
padding:25px;
border-radius:25px;
border:1px solid rgba(255,255,255,.1);
box-shadow:0 0 35px rgba(0,0,0,.7);
}

.logo{
display:flex;
justify-content:center;
margin-bottom:15px;
}

.logo img{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
background:white;
}

h1{
text-align:center;
margin-bottom:20px;
font-size:28px;
}

.bank{
background:#101927;
padding:18px;
border-radius:20px;
margin-bottom:15px;
text-align:center;
border:1px solid rgba(255,255,255,.08);
transition:.3s;
}

.bank.copiado{
transform:scale(1.03);
}

.bank-logo{
width:70px;
height:70px;
margin:auto;
margin-bottom:12px;
border-radius:50%;
overflow:hidden;
background:white;
padding:8px;
}

.bank-logo img{
width:100%;
height:100%;
object-fit:contain;
}

.type{
font-size:13px;
color:#4fa8ff;
font-weight:bold;
margin-bottom:10px;
}

.number{
font-size:24px;
font-weight:900;
margin-bottom:15px;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:15px;
font-size:15px;
font-weight:700;
color:white;
cursor:pointer;
}

.santa{
background:#0068ff;
}

.banesco{
background:#008a45;
}

.toast{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
background:#111;
padding:14px 18px;
border-radius:20px;
opacity:0;
transition:.3s;
}

.toast.show{
opacity:1;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">
<img src="logo.png">
</div>

<h1>LAMINADOS RD</h1>

<div class="bank santa-card">

<div class="bank-logo">
<img src="santacruz.png">
</div>

<div class="type">
CUENTA CORRIENTE
</div>

<div class="number">
11432010015511
</div>

<button class="btn santa"
onclick="copiar('11432010015511','santa-card')">

Copiar cuenta
</button>

</div>


<div class="bank banesco-card">

<div class="bank-logo">
<img src="banesco.png">
</div>

<div class="type">
CUENTA AHORRO COMERCIAL
</div>

<div class="number">
6200054988
</div>

<button class="btn banesco"
onclick="copiar('6200054988','banesco-card')">

Copiar cuenta
</button>

</div>

</div>

<script>

function copiar(numero,clase){

navigator.clipboard.writeText(numero);

let card=document.querySelector("." + clase);

card.classList.add("copiado");

setTimeout(()=>{
card.classList.remove("copiado");
},300);

mostrarToast("Cuenta copiada ✓");

}

function mostrarToast(texto){

const toast=document.createElement("div");

toast.className="toast";

toast.innerText=texto;

document.body.appendChild(toast);

setTimeout(()=>{
toast.classList.add("show");
},50);

setTimeout(()=>{
toast.classList.remove("show");
setTimeout(()=>{
toast.remove();
},300)
},2000);

}

</script>

</body>
</html>
