<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laminados RD</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
min-height:100vh;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

background:
radial-gradient(circle at 20% 10%,rgba(30,184,255,.9),transparent 28%),
radial-gradient(circle at 80% 20%,rgba(4,81,199,.85),transparent 30%),
linear-gradient(180deg,#031226 0%,#0451c7 45%,#eef4fb 100%);

padding:26px 14px;
color:white;
overflow-x:hidden;
}

.card{

max-width:430px;
margin:auto;
position:relative;

padding:28px 20px 22px;

border-radius:36px;

background:rgba(255,255,255,.13);

border:1px solid rgba(255,255,255,.35);

box-shadow:0 25px 60px rgba(0,0,0,.35);

backdrop-filter:blur(18px);

overflow:hidden;

}

.card::before{

content:"";

position:absolute;

width:260px;
height:260px;

border-radius:50%;

background:rgba(30,184,255,.25);

top:-90px;
right:-90px;

filter:blur(8px);

}

.hero{

position:relative;

z-index:2;

text-align:center;

}

.logo-principal{

width:125px;
height:125px;

border-radius:50%;

background:white;

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;

margin:auto;

margin-bottom:18px;

box-shadow:
0 15px 35px rgba(0,0,0,.25);

}

.logo-principal img{

width:100%;
height:100%;

object-fit:cover;

}

.badge{

display:inline-block;

padding:8px 14px;

border-radius:999px;

background:rgba(255,255,255,.15);

font-size:12px;

font-weight:900;

margin-bottom:12px;

}

h1{

font-size:32px;

font-weight:900;

margin-bottom:10px;

}

.sub{

font-size:15px;

color:rgba(255,255,255,.8);

margin-bottom:18px;

}

.rnc{

display:inline-flex;

padding:11px 16px;

border-radius:16px;

background:rgba(0,0,0,.2);

cursor:pointer;

font-weight:700;

margin-bottom:24px;

}

.panel{

background:rgba(0,0,0,.18);

padding:18px;

border-radius:28px;

}

.bank{

display:flex;

align-items:center;

gap:14px;

padding:12px;

border-radius:22px;

margin-bottom:14px;

background:rgba(255,255,255,.12);

transition:.3s;

}

.bank:last-child{

margin-bottom:0;

}

.bank.copiado{

transform:scale(1.03);

box-shadow:
0 0 25px rgba(30,184,255,.6);

}

.bank-logo{

width:68px;
height:68px;

border-radius:50%;

background:white;

display:flex;

align-items:center;
justify-content:center;

overflow:hidden;

flex-shrink:0;

}

.bank-logo img{

width:75%;
height:75%;

object-fit:contain;

}

.banesco-logo{

background:linear-gradient(
135deg,
#0451c7,
#1eb8ff
);

}

.banesco-logo img{

width:100%;
height:100%;

object-fit:cover;

}

.bank-info{

flex:1;

}

.bank-name{

font-size:13px;

font-weight:700;

margin-bottom:8px;

color:rgba(255,255,255,.8);

}

.btn{

width:100%;
height:52px;

border:none;

border-radius:16px;

font-size:15px;

font-weight:900;

color:white;

cursor:pointer;

}

.santa-btn{

background:linear-gradient(
180deg,
#22d875,
#00a84d
);

}

.banesco-btn{

background:linear-gradient(
180deg,
#1f88ff,
#0067ff
);

}

.footer{

margin-top:16px;

text-align:center;

background:rgba(255,255,255,.8);

padding:12px;

border-radius:18px;

font-weight:800;

color:#0451c7;

}

.toast{

position:fixed;

bottom:25px;

left:50%;

transform:translateX(-50%);

background:#071321;

padding:12px 18px;

border-radius:18px;

opacity:0;

transition:.3s;

z-index:9999;

}

.toast.show{

opacity:1;

}

</style>
</head>

<body>

<div class="card">

<div class="hero">

<div class="logo-principal">

<img src="logo.png">

</div>

<div class="badge">

PAGOS EMPRESARIALES

</div>

<h1>

LAMINADOS RD

</h1>

<div class="sub">

Selecciona tu banco y copia la cuenta

</div>

<div class="rnc" onclick="copiarRNC()">

RNC: 133-16232-6

</div>

</div>


<div class="panel">

<div class="bank santa-card">

<div class="bank-logo">

<img src="santacruz.png">

</div>

<div class="bank-info">

<div class="bank-name">

Cuenta corriente · Banco Santa Cruz

</div>

<button class="btn santa-btn"

onclick="copiarYabrir('11432010015511','santa-card','santacruz')">

Copiar y abrir banco

</button>

</div>

</div>


<div class="bank banesco-card">

<div class="bank-logo banesco-logo">

<img src="banesco.png">

</div>

<div class="bank-info">

<div class="bank-name">

Ahorro comercial · Banesco

</div>

<button class="btn banesco-btn"

onclick="copiarYabrir('6200054988','banesco-card','banesco')">

Copiar y abrir banco

</button>

</div>

</div>

</div>

<div class="footer">

Gracias por su preferencia 🔒

</div>

</div>


<script>

function copiarYabrir(numero,clase,banco){

navigator.clipboard.writeText(numero);

let card=document.querySelector("." + clase);

card.classList.add("copiado");

setTimeout(()=>{
card.classList.remove("copiado");
},300);

mostrarToast("Cuenta copiada ✓");

setTimeout(()=>{

if(banco==="santacruz"){

window.location.href="https://apps.apple.com/do/app/app-banco-santa-cruz/id1548944631";

}

if(banco==="banesco"){

window.location.href="https://apps.apple.com/do/app/banesco-rd/id1446763614";

}

},700);

}

function copiarRNC(){

navigator.clipboard.writeText("133-16232-6");

mostrarToast("RNC copiado ✓");

}

function mostrarToast(texto){

const toast=document.createElement("div");

toast.className="toast";

toast.innerText=texto;

document.body.appendChild(toast);

setTimeout(()=>toast.classList.add("show"),50);

setTimeout(()=>{
toast.classList.remove("show");

setTimeout(()=>{
toast.remove();
},300);

},2200);

}

</script>

</body>
</html>
