<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Laminados RD</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
background:
radial-gradient(circle at top,#0c2347,#000 70%);
padding:25px 15px;
color:white;
}

.card{

max-width:420px;
margin:auto;

background:#050b15;

padding:25px;

border-radius:35px;

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 0 50px rgba(0,0,0,.9);

}

.logo{

display:flex;
justify-content:center;

margin-bottom:18px;

}

.logo img{

width:120px;
height:120px;

border-radius:50%;

background:white;

object-fit:cover;

}

h1{

text-align:center;

font-size:28px;

margin-bottom:12px;

}

.rnc{

text-align:center;

font-size:17px;

margin-bottom:28px;

cursor:pointer;

color:#ccc;

}

.rnc span{

color:#fff;
font-weight:700;

}

.bank{

background:#0a0f18;

border-radius:24px;

padding:16px;

margin-bottom:18px;

border:1px solid rgba(255,255,255,.08);

display:flex;

align-items:center;

gap:18px;

transition:.3s;

}

.bank.copiado{

transform:scale(1.03);

}

.bank-logo{

width:75px;
height:75px;

border-radius:50%;

overflow:hidden;

background:white;

display:flex;

align-items:center;

justify-content:center;

flex-shrink:0;

}

.bank-logo img{

width:75%;
height:75%;

object-fit:contain;

}

.btn{

height:68px;

flex:1;

border:none;

border-radius:18px;

font-size:20px;

font-weight:800;

color:white;

cursor:pointer;

}

.btn:active{

transform:scale(.97);

}

.santa-btn{

background:#00a347;

}

.banesco-btn{

background:#1673ff;

}

.footer{

margin-top:15px;

text-align:center;

font-size:13px;

color:#888;

}

.toast{

position:fixed;

bottom:25px;

left:50%;

transform:translateX(-50%);

background:#111;

padding:14px 18px;

border-radius:16px;

opacity:0;

transition:.3s;

font-size:14px;

box-shadow:0 0 25px rgba(0,0,0,.8);

z-index:9999;

}

.toast.show{

opacity:1;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<img src="logo.png">

</div>

<h1>LAMINADOS RD</h1>

<div class="rnc"
onclick="copiarRNC()">

RNC:
<span>

133-16232-6

</span>

</div>


<div class="bank santa-card">

<div class="bank-logo">

<img src="santacruz.png">

</div>

<button
class="btn santa-btn"
onclick="copiar('11432010015511','santa-card')">

Copiar cuenta

</button>

</div>


<div class="bank banesco-card">

<div class="bank-logo">

<img src="banesco.png">

</div>

<button
class="btn banesco-btn"
onclick="copiar('6200054988','banesco-card')">

Copiar cuenta

</button>

</div>

<div class="footer">

Gracias por su preferencia 🔒

</div>

</div>


<script>

function copiar(numero,clase){

navigator.clipboard.writeText(numero);

let card=document.querySelector("." + clase);

card.classList.add("copiado");

setTimeout(()=>{

card.classList.remove("copiado");

},300);

mostrarToast("Cuenta copiada ✓");

}


function copiarRNC(){

navigator.clipboard.writeText(
"133-16232-6"
);

mostrarToast(
"RNC copiado ✓"
);

}


function mostrarToast(texto){

const toast=
document.createElement("div");

toast.className="toast";

toast.innerText=texto;

document.body.appendChild(toast);

setTimeout(()=>{

toast.classList.add("show");

},50);

setTimeout(()=>{

toast.classList.remove("show");

setTimeout(()=>{

toast.remove();

},300);

},2000);

}

</script>

</body>
</html>
